<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Record — Emergency Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:      #0A0F1E;
    --slate:     #1E2D4A;
    --off-white: #E8F4FD;
    --muted:     #7B9BB8;
    --blue:      #3B82F6;
    --red:       #EF4444;
    --green:     #10B981;
    --amber:     #F59E0B;
    --bd:        rgba(255,255,255,0.08);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--navy);
    color: var(--off-white);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: #991B1B;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon { font-size: 26px; }
  .header-title { font-size: 16px; font-weight: 600; }
  .header-sub {
    font-size: 11px;
    opacity: 0.8;
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
    letter-spacing: 0.03em;
  }

  .body { padding: 16px 20px; max-width: 560px; margin: 0 auto; }

  /* RESPONDER BANNER */
  .banner {
    background: rgba(59,130,246,0.1);
    border: 0.5px solid rgba(59,130,246,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: #93C5FD;
    font-family: 'DM Mono', monospace;
    margin-bottom: 16px;
    line-height: 1.6;
    letter-spacing: 0.02em;
  }

  /* ALLERGY ALERT — first thing they see */
  .alert-block {
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.45);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .alert-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: #F87171;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .allergy-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 0;
    border-bottom: 0.5px solid rgba(239,68,68,0.15);
  }
  .allergy-item:last-child { border-bottom: none; }
  .allergy-name { font-size: 15px; font-weight: 600; color: #FCA5A5; }
  .allergy-reaction { font-size: 12px; color: #F87171; font-family: 'DM Mono', monospace; }
  .allergy-mild { color: var(--muted); }
  .allergy-mild .allergy-name { color: #FCD34D; font-size: 14px; }
  .allergy-mild .allergy-reaction { color: #D97706; }

  /* SECTIONS */
  .section {
    background: var(--slate);
    border: 0.5px solid var(--bd);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 6px 0;
    border-bottom: 0.5px solid var(--bd);
    font-size: 13px;
    gap: 12px;
  }
  .row:last-child { border-bottom: none; padding-bottom: 0; }
  .row .k { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; flex-shrink: 0; }
  .row .v { font-weight: 500; color: var(--off-white); text-align: right; }
  .v-green { color: #6EE7B7; }
  .v-blue  { color: #93C5FD; }
  .v-amber { color: #FCD34D; }
  .v-red   { color: #FCA5A5; }
  .v-mono  { font-family: 'DM Mono', monospace; font-size: 12px; }

  .timestamp {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    padding: 16px 0 8px;
    letter-spacing: 0.06em;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🚑</div>
  <div>
    <div class="header-title">Emergency Health Record</div>
    <div class="header-sub" id="header-sub">Shared for emergency access · No login required</div>
  </div>
</div>

<div class="body">
  <div class="banner">
    This record was shared by the patient for emergency use.<br>
    No account or app needed. Read-only access.
  </div>

  <div id="main-content">
    <div style="padding:40px 0;text-align:center;font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);">
      Loading health record…
    </div>
  </div>

  <div class="timestamp" id="timestamp"></div>
</div>

<script>
  function age(dob) {
    const d = new Date(dob), n = new Date();
    let a = n.getFullYear() - d.getFullYear();
    if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--;
    return a;
  }

  function fmtDate(s) {
    return new Date(s).toLocaleDateString('en-GB',
      { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function renderOnlineCard(d) {
    const id   = d.identity;
    const meta = d.meta;

    document.getElementById('header-sub').textContent =
      `Token: ${meta.token} · No login required`;

    const critical = d.allergies.filter(a => a.severity === 'critical');
    const other    = d.allergies.filter(a => a.severity !== 'critical');

    const html = `
      <div class="alert-block">
        <div class="alert-title">⚠ Critical Allergies — Do Not Administer</div>
        ${critical.map(a => `
          <div class="allergy-item">
            <span class="allergy-name">${a.name}</span>
            <span class="allergy-reaction">${a.reaction}</span>
          </div>`).join('')}
        ${other.map(a => `
          <div class="allergy-item allergy-mild">
            <span class="allergy-name">${a.name} (mild)</span>
            <span class="allergy-reaction">${a.reaction}</span>
          </div>`).join('')}
      </div>

      <div class="section">
        <div class="section-title">Identity</div>
        <div class="row"><span class="k">Name</span><span class="v">${id.name}</span></div>
        <div class="row"><span class="k">Date of birth</span><span class="v">${fmtDate(id.dob)} (${age(id.dob)} yrs)</span></div>
        <div class="row"><span class="k">Sex</span><span class="v">${id.sex}</span></div>
        <div class="row"><span class="k">Blood type</span><span class="v v-blue">${id.blood_type}</span></div>
        <div class="row"><span class="k">Organ donor</span><span class="v ${id.organ_donor ? 'v-green' : 'v-amber'}">${id.organ_donor ? 'Yes' : 'No'}</span></div>
      </div>

      <div class="section">
        <div class="section-title">Conditions</div>
        ${d.conditions.map(c => `
          <div class="row">
            <span class="k">${c.name}</span>
            <span class="v v-green">${c.status} · since ${c.since}</span>
          </div>`).join('')}
      </div>

      <div class="section">
        <div class="section-title">Medications</div>
        ${d.medications.map(m => `
          <div class="row">
            <span class="k">${m.name}</span>
            <span class="v">${m.dose} · ${m.frequency}</span>
          </div>`).join('')}
      </div>

      <div class="section">
        <div class="section-title">Recent Vitals
          <span style="font-size:9px;margin-left:8px;opacity:0.6;">(recorded ${fmtDate(d.vitals.recorded)})</span>
        </div>
        <div class="row"><span class="k">Blood pressure</span><span class="v v-green">${d.vitals.bp_systolic} / ${d.vitals.bp_diastolic} mmHg</span></div>
        <div class="row"><span class="k">Resting HR</span><span class="v v-green">${d.vitals.resting_hr} bpm</span></div>
        <div class="row"><span class="k">Weight</span><span class="v">${id.weight_kg} kg</span></div>
        <div class="row"><span class="k">HbA1c</span><span class="v v-green">${d.vitals.hba1c}</span></div>
      </div>

      <div class="section">
        <div class="section-title">Emergency Contacts</div>
        ${d.contacts.map(c => `
          <div class="row">
            <span class="k">${c.name}${c.primary ? ' ★' : ''}<br>
              <span style="opacity:0.6;font-size:10px;">${c.relation}</span>
            </span>
            <span class="v v-mono">${c.phone}</span>
          </div>`).join('')}
      </div>
    `;

    document.getElementById('main-content').innerHTML = html;
    document.getElementById('timestamp').textContent =
      `Record v${meta.version} · Updated ${fmtDate(meta.updated)} · Read-only emergency access`;
  }

  async function init() {
    try {
      const res  = await fetch('../profile.json');
      const data = await res.json();
      renderOnlineCard(data);
    } catch(e) {
      document.getElementById('main-content').innerHTML =
        '<p style="color:#FCA5A5;font-family:\'DM Mono\',monospace;padding:40px 0;text-align:center;">' +
        'Could not load health record. Check the URL.</p>';
    }
  }

  init();
</script>
</body>
</html>
